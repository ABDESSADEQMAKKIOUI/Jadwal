services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jadwal
      POSTGRES_USER: jadwal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jadwal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jadwal -d jadwal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Réservé aux lots suivants : progression du solveur en temps réel.
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Réservé au module d'ingestion des emplois du temps publics (stockage de fichiers).
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jadwal
      SPRING_DATASOURCE_USERNAME: jadwal
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-jadwal}
      JADWAL_JWT_SECRET: ${JADWAL_JWT_SECRET:-jadwal-dev-secret-change-me-0123456789abcdef}
      JADWAL_ADMIN_PASSWORD: ${JADWAL_ADMIN_PASSWORD:-admin123}
      JADWAL_DEMO: ${JADWAL_DEMO:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
