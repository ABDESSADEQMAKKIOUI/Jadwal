spring:
  application:
    name: jadwal-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jadwal}
    username: ${SPRING_DATASOURCE_USERNAME:jadwal}
    password: ${SPRING_DATASOURCE_PASSWORD:jadwal}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Import Massar : la même limite de 5 Mo est revérifiée dans ImportMassarService.
      max-file-size: 5MB
      max-request-size: 6MB
      # Seuil de bascule sur disque aligné sur la taille maximale : le fichier
      # d'élèves (données personnelles de mineurs) reste en mémoire et n'est
      # jamais déposé dans le répertoire temporaire du conteneur.
      file-size-threshold: 5MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  tomcat:
    # Un téléversement refusé (fichier trop gros) doit recevoir une réponse JSON
    # propre : Tomcat doit donc consommer la fin du corps au lieu de couper la
    # connexion. Plafonné pour ne pas en faire un levier de saturation.
    max-swallow-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health

timefold:
  solver:
    termination:
      spent-limit: 120s
      unimproved-spent-limit: 30s

jadwal:
  # AUCUNE valeur de repli, volontairement : ces deux secrets gouvernent toute
  # l'authentification et l'isolation entre établissements. Un repli codé en dur
  # dans un dépôt public revient à publier la clé de production — le contexte
  # Spring doit donc refuser de démarrer si la variable est absente.
  jwt:
    secret: ${JADWAL_JWT_SECRET}
  admin:
    password: ${JADWAL_ADMIN_PASSWORD}
  demo: ${JADWAL_DEMO:false}
