spring:
  application:
    name: jadwal-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jadwal}
    username: ${SPRING_DATASOURCE_USERNAME:jadwal}
    password: ${SPRING_DATASOURCE_PASSWORD:jadwal}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

timefold:
  solver:
    termination:
      spent-limit: 120s
      unimproved-spent-limit: 30s

jadwal:
  # AUCUNE valeur de repli, volontairement : ces deux secrets gouvernent toute
  # l'authentification et l'isolation entre établissements. Un repli codé en dur
  # dans un dépôt public revient à publier la clé de production — le contexte
  # Spring doit donc refuser de démarrer si la variable est absente.
  jwt:
    secret: ${JADWAL_JWT_SECRET}
  admin:
    password: ${JADWAL_ADMIN_PASSWORD}
  demo: ${JADWAL_DEMO:false}
