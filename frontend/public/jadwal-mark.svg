<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="JADWAL">
  <title>JADWAL</title>
  <!--
    Symbole JADWAL — le « J » construit en cases de grille.
    Grille 3×3 stricte : cases de 6, gouttières de 3, positions 0 / 9 / 18.
    Cases pleines = la lettre J. Cases en contour = la grille encore à remplir.
    Une seule couleur : teal Ocean Green #47a398 (design system Ynexis).
  -->
  <g fill="none" stroke="#47a398" stroke-width="1.5" stroke-opacity="0.3">
    <rect x="0.75" y="0.75" width="4.5" height="4.5" rx="1.25" />
    <rect x="9.75" y="0.75" width="4.5" height="4.5" rx="1.25" />
    <rect x="0.75" y="9.75" width="4.5" height="4.5" rx="1.25" />
    <rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1.25" />
  </g>
  <g fill="#47a398">
    <rect x="18" y="0" width="6" height="6" rx="1.75" />
    <rect x="18" y="9" width="6" height="6" rx="1.75" />
    <rect x="0" y="18" width="6" height="6" rx="1.75" />
    <rect x="9" y="18" width="6" height="6" rx="1.75" />
    <rect x="18" y="18" width="6" height="6" rx="1.75" />
  </g>
</svg>
